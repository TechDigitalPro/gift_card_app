name: gift_card
description: Gift Card project.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=2.19.3 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: 
    sdk: flutter

  # Design
  cupertino_icons: ^1.0.2
  google_fonts: ^4.0.3 
  flutter_svg: ^2.0.2
  flutter_native_splash: ^2.2.19
  cached_network_image: ^3.2.3

  # for MVC
  stacked: ^3.1.1
  get_it: ^7.2.0
  provider: ^6.0.1

  # System
  shared_preferences: ^2.0.9
  permission_handler: ^10.2.0

  # Api calls
  dio: ^5.0.3

  # Utils
  nb_utils: ^5.0.5
  bot_toast: ^4.0.2
  url_launcher: ^6.1.10
  uni_links: ^0.5.1
  share_plus: ^6.3.1
  rxdart: ^0.27.4
  intl: ^0.18.0
  intl_utils: ^2.8.2
  keyboard_actions: ^4.2.0
  mobile_scanner: ^3.2.0
  google_maps_flutter: ^2.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

dependency_overrides:
  intl: ^0.17.0

flutter:
  generate: true
  uses-material-design: true
  assets:
  - assets/
  - assets/images/
  - assets/images/png/
  - assets/images/svg/
  - assets/images/json/
  - assets/fonts/
